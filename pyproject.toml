[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-info-collection"
version = "0.1.0"
description = "用于采集和解析中英双语电影字幕的 Windows 桌面工具。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "aiolimiter>=1.1",
  "charset-normalizer>=3.3",
  "pysubs2>=1.7",
  "python-dotenv>=1.0",
  "keyring>=25.0",
  "playwright>=1.44",
  "beautifulsoup4>=4.12",
  "py7zr>=0.21",
  "rarfile>=4.2",
  "PySide6-Fluent-Widgets>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "pyinstaller>=6.8",
]

[project.scripts]
subtitle-info-collection = "subtitle_info_collection.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
